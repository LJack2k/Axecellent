# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Mod identity
mod_id=axecellent
# mod_name is the *technical* name: it forms the jar archivesName. Keep it
# filename-safe (no spaces). mod_display_name is what players see in the mod
# list / resource-pack description, so never build a filename from it.
mod_name=Axecellent
mod_display_name=Axecellent
mod_license=MIT
mod_version=0.1.0
mod_group_id=nl.ljack2k.axecellent
mod_authors=LJack2k
# Loader for this branch - read by the release workflows so each MC line publishes
# with the correct loader tag.
mod_loaders=neoforge
mod_description=Break the base of a tree and it comes apart progressively - the cut starts at the furthest branch, works back through the tree, and finishes on the block you hit, each log taking its leaves with it. Which tool can do it is decided by the #axecellent:chainsaw item tag, which ships EMPTY: nothing cuts trees until a datapack or script names a tool, so packs pick exactly which item gets it, with no enchantment involved. Cut speed, logs per break, leaf clearing, durability cost and drop location are all configurable, and an INSTANT mode is available. Server-side; no items, blocks or enchantments are added.

# Minecraft / NeoForge - verify at https://projects.neoforged.net/neoforged/neoforge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neo_version=21.1.242
neo_version_range=[21.1.181,)
loader_version_range=[4,)
# Java toolchain for this MC line (1.21.x = 21; 26.1+ = 25). Read by BOTH the
# Gradle toolchain (neoforge/build.gradle) and the release workflows, so a new
# MC line sets the JDK in exactly one place.
java_version=21

# JEI - DEV ONLY convenience (item search + cheat-spawn in runClient). Not a
# dependency of the mod and never bundled into the jar. Bump from the JEI
# CurseForge file page's "Curse Maven Snippet".
# -PnoJei drops it from the dev runtime.
jei_curse_file_id=7420587

# Dev client window position, in Windows virtual-desktop coordinates. Minecraft
# does not remember its window position, so without this every runClient lands on
# the primary monitor. Applied only in dev runs (see neoforge/build.gradle); the
# published jar has no window code at all. Leave both blank to let Minecraft place
# the window itself. Left-hand monitor on this machine starts at x=-1920.
dev_window_x=-1920
dev_window_y=0

# KubeJS - DEV ONLY pack-dev tooling. Its /kubejs hand command dumps the held
# item's id, tags and components, which is how a tag-driven mod like this one gets
# inspected in-game. Never bundled into the jar and not a dependency of the mod.
# -PnoKubeJs drops it from the dev runtime.
# Versions are MC-prefixed: 2101 = 1.21.1. Rhino comes in transitively.
kubejs_version=2101.7.2-build.372
